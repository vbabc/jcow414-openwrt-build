name: JCOW414 Airtel main build

on:
  push:
    branches:
      - build/uday-airtel-main-8c465ba

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Check out the build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare the hosted Linux runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts .cache/downloads
          for sdk in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            available=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
            if (( available >= 26214400 )); then break; fi
            sudo rm -rf -- "$sdk"
          done
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')" -ge 26214400
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates patch \
            diffutils perl time cmake ninja-build pkgconf libelf-dev libdw-dev \
            zstd xz-utils device-tree-compiler

      - name: Restore previously downloaded public source archives
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/downloads
          key: jcow414-uday-downloads-${{ hashFiles('ci/uday-airtel-feeds.conf') }}
          restore-keys: |
            jcow414-ubuntu24-

      - name: Build and identify the Airtel main image
        shell: bash
        run: bash ci/build-uday-airtel-main.sh

      - name: Upload firmware and build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcow414-airtel-main-8c465ba
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
