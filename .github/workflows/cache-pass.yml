name: One isolated cache benchmark pass

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      variant:
        required: true
        type: string

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VARIANT: ${{ inputs.variant }}
      EXPERIMENT_PHASE: ${{ inputs.phase }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout experiment inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare independent hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPERIMENT_PHASE" = prime || test "$EXPERIMENT_PHASE" = warm || test "$EXPERIMENT_PHASE" = auto
          echo "BUILD_ROOT=$RUNNER_TEMP/jcow414-build" >> "$GITHUB_ENV"
          # Fixed SDK paths on this experiment's disposable VM only.
          for sdk_path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
            if test "$available" -ge 26214400; then break; fi
            sudo rm -rf -- "$sdk_path"
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget curl ca-certificates patch diffutils perl time ccache cmake ninja-build pkgconf libelf-dev libdw-dev zstd xz-utils device-tree-compiler
          mkdir -p artifacts .cache/downloads .cache/ccache
          dpkg-query -W > artifacts/runner-packages.lock
          nproc
          free -h
          df -h "$RUNNER_TEMP"
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 26214400

      - name: Read existing download and compiler cache without saving it
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/downloads
            .cache/ccache
          key: jcow414-ubuntu24-experiment-read-only-${{ github.run_id }}-${{ inputs.phase }}
          restore-keys: |
            jcow414-ubuntu24-

      - name: Prepare exact firmware inputs and cache identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test-toolchain-cache.py 2>&1 | tee artifacts/cache-tests.log
          python3 ci/prepare.py "$VARIANT" 2>&1 | tee artifacts/prepare.log
          python3 ci/toolchain-cache.py identity

      - name: Restore only this experiment's exact toolchain cache
        if: inputs.phase != 'prime'
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/toolchain-experiment
          key: ${{ steps.identity.outputs.key }}
          fail-on-cache-miss: ${{ inputs.phase == 'warm' }}

      - name: Verify and unpack tools on the fresh warm runner
        if: inputs.phase != 'prime' && steps.tools.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test '${{ steps.tools.outputs.cache-hit }}' = true
          python3 ci/toolchain-cache.py unpack

      - name: Build current kernel and firmware with all hardware guards
        shell: bash
        run: bash ci/cache-build.sh

      - name: Create bounded experiment-only toolchain archive
        if: inputs.phase == 'prime' || (inputs.phase == 'auto' && steps.tools.outputs.cache-hit != 'true')
        shell: bash
        run: python3 ci/toolchain-cache.py pack

      - name: Save only the bounded experiment cache
        if: inputs.phase == 'prime' || (inputs.phase == 'auto' && steps.tools.outputs.cache-hit != 'true')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/toolchain-experiment
          key: ${{ steps.identity.outputs.key }}

      - name: Summarize benchmark pass
        if: always()
        shell: bash
        run: |
          echo "### Cache experiment: $EXPERIMENT_PHASE / $VARIANT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Independent VM; current kernel/DTB freshly prepared and checked; no deployment.' >> "$GITHUB_STEP_SUMMARY"
          if test -f artifacts/phase-seconds.txt; then
            echo 'Phase timings in seconds:' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/phase-seconds.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload separately named benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jcow414-development-${{ inputs.variant }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
