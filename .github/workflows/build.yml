name: Cached guarded JCOW414 development builds

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Diagnostic build only; no deployment
        required: true
        default: rx-diag
        type: choice
        options:
          - baseline
          - probe-only
          - frontend-diag
          - phy-diag
          - mac-diag
          - rx-diag

permissions:
  contents: read

concurrency:
  group: jcow414-phy-development-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  firmware:
    uses: ./.github/workflows/cache-pass.yml
    with:
      phase: auto
      variant: ${{ inputs.variant }}
