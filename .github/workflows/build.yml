name: Isolated toolchain cache benchmark

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Identical firmware inputs for both benchmark passes
        required: true
        default: frontend-diag
        type: choice
        options:
          - baseline
          - probe-only
          - frontend-diag

permissions:
  contents: read

concurrency:
  group: jcow414-speed-experiment-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  prime:
    uses: ./.github/workflows/cache-pass.yml
    with:
      phase: prime
      variant: ${{ inputs.variant }}
  warm:
    needs: prime
    uses: ./.github/workflows/cache-pass.yml
    with:
      phase: warm
      variant: ${{ inputs.variant }}
